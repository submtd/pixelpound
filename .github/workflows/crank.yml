name: crank
# Reveals fulfilled PixelPups mints, then claims expired decisions (default keep), so an abandoned tab never holds
# back max_buyback. Both instructions are permissionless; the crank key holds devnet SOL for fees and asset rent only.
# crank.mjs is a bundled build published from the private source repo (submtd/pixelpups-program) on every site deploy.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crank
  cancel-in-progress: false

jobs:
  crank:
    if: vars.PIXELPUPS_PROGRAM_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - name: Crank
        env:
          # Secrets, not variables: this repo's logs are public and secrets are masked.
          RPC_URL: ${{ secrets.PIXELPUPS_RPC_URL }}
          PROGRAM_ID: ${{ vars.PIXELPUPS_PROGRAM_ID }}
          CRANK_KEYPAIR: ${{ secrets.PIXELPUPS_CRANK_KEYPAIR }}
        run: node --no-deprecation crank.mjs
